name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gshocksrv") | .version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag version $tag_version does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --locked --all-targets

  create-release:
    name: Create draft Release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

  upload-assets:
    name: Build ${{ matrix.asset }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and upload release asset
        uses: taiki-e/upload-rust-binary-action@v1.30.2
        with:
          bin: gshocksrv
          target: ${{ matrix.target }}
          archive: gshocksrv-$tag-${{ matrix.asset }}
          tar: none
          zip: all
          include: README.md
          leading-dir: true
          locked: true
          checksum: sha256

  publish-release:
    name: Publish GitHub Release
    needs: upload-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
